site_name: ASP.NET Core Interview Notes
site_description: Study notes and interview preparation for ASP.NET Core, from C# fundamentals to distributed systems.
site_url: https://sultanfarooka.github.io/aspnet-interview-notes/
repo_url: https://github.com/sultanfarooka/aspnet-interview-notes
repo_name: aspnet-interview-notes
edit_uri: edit/main/

docs_dir: docs
site_dir: site

# Present in docs/ and readable in VS Code, but deliberately NOT published:
#   MY-PROJECTS.md - personal project details and talking points
#   PROGRESS.md    - self-assessment of which topics are weak
# Removing these two lines would publish them. That is the point of the comment.
exclude_docs: |
  MY-PROJECTS.md
  PROGRESS.md

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant       # tapping a link swaps content without a full reload
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top           # back-to-top button, useful on long notes
    - navigation.indexes
    - navigation.footer        # prev/next links at the bottom of every page
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy        # copy button on every code block
    - content.tooltips
  palette:
    # Follows the phone's system setting first, then allows a manual toggle
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details          # the <details> blocks in the question bank
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Renders ```mermaid blocks as diagrams (DIAGRAMS.md and note 1.1)
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# ~364 links deliberately point at notes that are not written yet. Warning on each one
# would bury real problems, and the custom 404 page handles them for the reader.
validation:
  nav:
    omitted_files: info
    not_found: info
  links:
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sultanfarooka/aspnet-interview-notes

# NOTE: add one line here for every new note written. See README "Writing a new note".
